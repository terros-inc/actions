name: "OpenCodeReview GitHub Action"
description: "Run AI-powered code review on PRs using OpenCodeReview"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  openrouter_api_key:
    description: "OpenRouter API key for LLM access"
    required: true

  github_token:
    description: "GitHub token for posting review comments. Use a PAT if org restricts GITHUB_TOKEN permissions."
    required: false
    default: ${{ github.token }}

  model:
    description: "LLM model to use (provider/model format)"
    required: false
    default: "@preset/code-review"

  base_ref:
    description: "Base branch ref to diff against (e.g., origin/main)"
    required: true

  head_sha:
    description: "Head commit SHA to review"
    required: true

  pr_number:
    description: "Pull request number to post comments on"
    required: true

  node_version:
    description: "Node.js version"
    required: false
    default: "24"

  reasoning:
    description: "Enable reasoning for the LLM (true/false)"
    required: false
    default: "true"

  reasoning_effort:
    description: "Reasoning effort level: xhigh, high, medium, low, minimal, none"
    required: false
    default: "high"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ inputs.node_version }}
        package-manager-cache: false

    - name: Install OpenCodeReview
      shell: bash
      run: npm install -g @alibaba-group/open-code-review

    - name: Configure and run OpenCodeReview
      id: review
      shell: bash
      run: |
        ocr config set llm.url https://openrouter.ai/api/v1/chat/completions
        ocr config set llm.auth_token ${{ inputs.openrouter_api_key }}
        ocr config set llm.model ${{ inputs.model }}
        ocr config set llm.use_anthropic false
        if [ "${{ inputs.reasoning }}" = "true" ]; then
          ocr config set llm.extra_body '{"reasoning": {"effort": "${{ inputs.reasoning_effort }}"}}'
        fi

        echo "Reviewing ${{ inputs.head_sha }} against ${{ inputs.base_ref }}"

        ocr review \
          --from "${{ inputs.base_ref }}" \
          --to "${{ inputs.head_sha }}" \
          --format json \
          > /tmp/ocr-result.json 2>/tmp/ocr-stderr.log || true

        echo "OCR review completed."

    - name: Post review comments to PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs');

          let result;
          try {
            const raw = fs.readFileSync('/tmp/ocr-result.json', 'utf8');
            result = JSON.parse(raw);
          } catch (e) {
            console.log('Failed to parse OCR output:', e.message);
            const stderr = fs.readFileSync('/tmp/ocr-stderr.log', 'utf8').trim();
            if (stderr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ inputs.pr_number }},
                body: `⚠️ **OpenCodeReview** encountered an error:\n\`\`\`\n${stderr}\n\`\`\``
              });
            }
            return;
          }

          const comments = result.comments || [];
          const warnings = result.warnings || [];

          if (comments.length === 0) {
            if (!result.summary?.files_reviewed) return
            const message = result.message || 'No issues found. LGTM!';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: `✅ **OpenCodeReview**: ${message}`
            });
            return;
          }

          const prNumber = ${{ inputs.pr_number }};
          const commitSha = '${{ inputs.head_sha }}';

          const reviewComments = [];
          const commentsWithoutLine = [];

          for (const comment of comments) {
            const body = formatComment(comment);
            const hasValidLine = (comment.start_line >= 1) || (comment.end_line >= 1);
            if (!hasValidLine) {
              commentsWithoutLine.push({ comment, body });
              continue;
            }

            const reviewComment = { path: comment.path, body };
            if (comment.start_line >= 1 && comment.end_line >= 1 && comment.start_line !== comment.end_line) {
              reviewComment.start_line = comment.start_line;
              reviewComment.line = comment.end_line;
              reviewComment.start_side = 'RIGHT';
              reviewComment.side = 'RIGHT';
            } else if (comment.end_line >= 1) {
              reviewComment.line = comment.end_line;
              reviewComment.side = 'RIGHT';
            } else if (comment.start_line >= 1) {
              reviewComment.line = comment.start_line;
              reviewComment.side = 'RIGHT';
            }
            reviewComments.push(reviewComment);
          }

          const totalCount = comments.length;
          const inlineCount = reviewComments.length;
          const summaryCount = commentsWithoutLine.length;
          let summaryBody = `🔍 **OpenCodeReview** found **${totalCount}** issue(s) in this PR.`;
          if (totalCount > 0) {
            summaryBody += `\n- ✅ ${inlineCount} posted as inline comment(s)`;
            summaryBody += `\n- 📝 ${summaryCount} posted as summary (missing line info)`;
          }
          if (warnings.length > 0) {
            summaryBody += `\n\n⚠️ ${warnings.length} warning(s) occurred during review.`;
          }
          for (const { comment } of commentsWithoutLine) {
            summaryBody += '\n\n---\n\n';
            summaryBody += formatCommentMarkdown(comment);
          }

          let successCount = 0;
          let failedCount = 0;
          const failedComments = [];

          try {
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              commit_id: commitSha,
              body: summaryBody,
              event: 'COMMENT',
              comments: reviewComments
            });
            successCount = reviewComments.length;
            console.log('Successfully posted review with ' + successCount + ' inline comments (' + commentsWithoutLine.length + ' in summary)');
          } catch (e) {
            console.log('Failed to post review with inline comments:', e.message);
            for (const reviewComment of reviewComments) {
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  commit_id: commitSha,
                  body: '',
                  event: 'COMMENT',
                  comments: [reviewComment]
                });
                successCount++;
              } catch (innerE) {
                failedCount++;
                failedComments.push({ comment: reviewComment, error: innerE.message });
              }
            }

            let finalBody = summaryBody;
            finalBody += '\n\n---\n\n📊 **Posting Statistics:**';
            finalBody += '\n- ✅ Successfully posted: ' + successCount + ' comment(s)';
            if (failedCount > 0) {
              finalBody += '\n- ❌ Failed to post: ' + failedCount + ' comment(s)';
            }
            if (failedComments.length > 0) {
              finalBody += '\n\n<details><summary>❌ Failed Comments Details</summary>\n\n';
              for (const { comment, error } of failedComments) {
                finalBody += '- `' + comment.path + '`: ' + error + '\n';
              }
              finalBody += '\n</details>';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: finalBody
            });
          }

          function formatComment(comment) {
            let body = comment.content || '';
            if (comment.suggestion_code && comment.existing_code) {
              body += '\n\n**Suggestion:**\n';
              body += '```suggestion\n';
              body += comment.suggestion_code;
              if (!comment.suggestion_code.endsWith('\n')) body += '\n';
              body += '```';
            }
            return body;
          }

          function formatCommentMarkdown(comment) {
            let md = '### 📄 `' + comment.path + '`';
            if (comment.start_line && comment.end_line) {
              md += ' (L' + comment.start_line + '-L' + comment.end_line + ')';
            }
            md += '\n\n';
            md += comment.content || '';
            if (comment.suggestion_code && comment.existing_code) {
              md += '\n\n<details><summary>💡 Suggested Change</summary>\n\n';
              md += '**Before:**\n```\n' + comment.existing_code + '\n```\n\n';
              md += '**After:**\n```\n' + comment.suggestion_code + '\n```\n\n';
              md += '</details>';
            }
            return md;
          }
